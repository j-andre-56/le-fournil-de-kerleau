<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photos - Le Fournil de Kerléau</title>
  <meta name="description" content="Album photos - Le Fournil de Kerleau à Crac'h (56950)">
  <link rel="canonical" href="https://lefournildekerleau.fr/photos.html">

  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F2E8CF;
      --ink: #000;
      --font: 'Source Code Pro', monospace;
      --text: 13px;
      --text-mini: 11px;
      --gap: 30px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font);
      font-size: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 550px;
      padding: 170px 30px 220px;
    }

    a {
      color: var(--ink);
    }

    /* Logo fixe - identique à l'accueil */
    .header-fixed {
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 20;
    }

    .logo-wrapper {
      display: flex;
      justify-content: center;
      padding: 20px 30px;
    }

    .logo-top {
      width: 120px;
      height: 120px;
      animation: sunRotate 4s linear infinite;
    }

    @keyframes sunRotate {
      to { transform: rotate(360deg); }
    }

    /* RETOUR */
    .back {
      display: block;
      margin: 0 0 30px;
    }

    .back-bottom {
      margin: 30px 0 0;
    }

    /* GRILLE PHOTOS */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      max-width: 400px;
    }

    .grid img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    /* Téléphone : 1 colonne */
    @media (max-width: 420px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header class="header-fixed">
    <div class="logo-wrapper">
      <img class="logo-top" src="assets/le-fournil-de-kerleau-logo.svg" alt="Le Fournil de Kerleau">
    </div>
  </header>

  <main class="container">

    <a class="back" href="index.html"><<< RETOUR</a>

    <div class="grid">
      <img src="Assets/pain-quotidien.jpg" alt="">
      <img src="Assets/pain-special.jpg" alt="">
      <img src="Assets/four-bois.jpg" alt="">
      <img src="Assets/fournee.jpg" alt="">
      <img src="Assets/faconnage.jpg" alt="">
      <img src="Assets/levain.jpg" alt="">
    </div>

    <a class="back back-bottom" href="index.html"><<< RETOUR</a>

  </main>

</body>
</html>
