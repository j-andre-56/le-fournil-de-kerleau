<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos - Le Fournil de Kerleau</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #F2E8CF;
    }

    /* ===== GRILLE PHOTOS ===== */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 12px;
    }

    .grid img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    /* Sur téléphone : 1 colonne */
    @media (max-width: 420px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="grid">
    <img src="Assets/pain-quotidien.jpg" alt="">
    <img src="Assets/pain-special.jpg" alt="">
    <img src="Assets/four-bois.jpg" alt="">
    <img src="Assets/fournee.jpg" alt="">
    <img src="Assets/faconnage.jpg" alt="">
    <img src="Assets/levain.jpg" alt="">
  </div>

</body>
</html>
